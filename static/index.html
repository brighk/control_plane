<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Plane</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085;
      --border: #d9dde5; --accent: #2f6fed; --danger: #d64545; --ok: #1f8a4c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --card: #1d212a; --text: #e6e8ee; --muted: #9aa2b2;
        --border: #333a47; --accent: #5b8dff; --danger: #ef6b6b; --ok: #4cc27f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 48px 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 15px; margin: 24px 0 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    button {
      font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer; background: var(--accent); color: #fff;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.danger { background: var(--danger); }
    button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row > button { flex: 1; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header span { color: var(--muted); font-size: 13px; }
    #status { margin-top: 16px; min-height: 1.5em; font-size: 14px; }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--ok); }
    [hidden] { display: none !important; }
    .state { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .state::before {
      content: ""; display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; background: var(--muted);
    }
    .state.online::before  { background: var(--ok); }
    .state.offline::before { background: var(--danger); }
    #history table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #history th {
      text-align: left; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--border); padding: 6px 4px;
    }
    #history td { border-bottom: 1px solid var(--border); padding: 6px 4px; vertical-align: top; }
    #history td.time { white-space: nowrap; color: var(--muted); }
    #history .ok { color: var(--ok); }
    #history .failed { color: var(--danger); }
    #history .detail { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    details summary { cursor: pointer; font-weight: 600; margin-top: 24px; }

    .card.wide { max-width: 820px; min-width: 0; }  /* min-width: let the table scroll inside */
    #network h1 { margin-bottom: 4px; }
    #net-summary { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
    #net-summary b { color: var(--text); font-weight: 600; }
    #net-warning { margin-top: 12px; font-size: 13px; color: var(--danger); }
    .table-wrap { overflow-x: auto; margin-top: 16px; }
    #network table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #network th {
      text-align: left; font-weight: 600; color: var(--muted); white-space: nowrap;
      border-bottom: 1px solid var(--border); padding: 6px 8px;
    }
    #network td { border-bottom: 1px solid var(--border); padding: 8px; vertical-align: top; }
    #network th.num, #network td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #network .sub { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    #network tr.offline td { color: var(--muted); }
    #network .badge {
      display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px;
      font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent);
      white-space: nowrap;
    }
    #network .dot::before {
      content: ""; display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; background: var(--muted);
    }
    #network .dot.on::before { background: var(--ok); }
  </style>
</head>
<body>
  <!-- Login -->
  <form id="login-view" class="card" hidden>
    <h1>Control Plane</h1>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="row"><button type="submit">Log in</button></div>
    <div id="login-status" class="error"></div>
  </form>

  <!-- Main -->
  <main id="app-view" class="card" hidden>
    <div class="header">
      <h1>Control Plane</h1>
      <span><span id="whoami"></span> · <a href="#" id="logout">Log out</a></span>
    </div>

    <label for="host-select">Host</label>
    <select id="host-select"></select>
    <div id="host-state" class="state" hidden></div>
    <div class="row">
      <button id="wake-btn">Wake</button>
      <button id="shutdown-btn" class="danger">Shutdown</button>
    </div>
    <div class="row">
      <button id="delete-btn" class="secondary">Remove host</button>
    </div>
    <div id="status"></div>

    <details id="add-details">
      <summary>Add host</summary>
      <form id="add-form">
        <label for="h-name">Name</label>
        <input id="h-name" placeholder="Living room PC" required>
        <label for="h-mac">MAC address</label>
        <input id="h-mac" placeholder="AA:BB:CC:DD:EE:FF" required>
        <label for="h-ip">IP address / hostname</label>
        <input id="h-ip" placeholder="192.168.1.50" required>
        <label for="h-user">SSH username</label>
        <input id="h-user" value="admin" required>
        <label for="h-os">OS</label>
        <select id="h-os">
          <option value="linux">Linux</option>
          <option value="windows">Windows</option>
        </select>
        <div class="row"><button type="submit">Add host</button></div>
      </form>
    </details>

    <section id="history" hidden>
      <h2>History</h2>
      <table>
        <thead><tr><th>Time</th><th>Host</th><th>Action</th><th>Result</th></tr></thead>
        <tbody id="history-body"></tbody>
      </table>
    </section>
  </main>

  <!-- Network (from archer-monitor; hidden unless the server has it configured) -->
  <section id="network" class="card wide" hidden>
    <h1>Network</h1>
    <div id="net-summary"></div>
    <div id="net-warning" hidden></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Device</th><th>Connection</th>
            <th class="num">Download</th><th class="num">Upload</th>
            <th class="num" title="Wi-Fi link rate, router → device / device → router">Link</th>
            <th class="num" title="Router's signal value (aveRssi); higher is better">Signal</th>
          </tr>
        </thead>
        <tbody id="net-body"></tbody>
      </table>
    </div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let hosts = [];
    let stateTimer = null;     // repeats refreshHostState
    let slowDownTimer = null;  // switches fast polling back to slow
    let networkTimer = null;   // repeats loadNetwork while the page is visible

    function startPolling(ms) {
      clearInterval(stateTimer);  // never run two timers at once
      stateTimer = setInterval(refreshHostState, ms);
    }

    // After Wake/Shutdown: check every 5s for 2 minutes, then back to every 60s.
    function pollFastForAWhile() {
      startPolling(5_000);
      clearTimeout(slowDownTimer);
      slowDownTimer = setTimeout(() => startPolling(60_000), 120_000);
    }

    function stopPolling() {
      clearInterval(stateTimer);
      clearTimeout(slowDownTimer);
      clearInterval(networkTimer);
      networkTimer = null;
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401 && path !== "/api/auth/login") {
        showLogin();
        throw new Error("Session expired, please log in again");
      }
      const data = res.status === 204 ? null : await res.json().catch(() => null);
      if (!res.ok) throw new Error(errorText(data) || `Request failed (${res.status})`);
      return data;
    }

    // FastAPI errors are {detail: "..."} or {detail: [{msg, loc}, ...]} for validation.
    function errorText(data) {
      if (!data || !data.detail) return null;
      if (typeof data.detail === "string") return data.detail;
      return data.detail.map((d) => `${d.loc.at(-1)}: ${d.msg}`).join("; ");
    }

    function setStatus(text, kind = "") {
      $("status").textContent = text;
      $("status").className = kind;
    }

    function showLogin() {
      stopPolling();  // covers both logout and expired session (api() calls this on 401)
      $("app-view").hidden = true;
      $("network").hidden = true;
      $("login-view").hidden = false;
      $("username").focus();
    }

    async function showApp(username) {
      $("whoami").textContent = username;
      $("login-view").hidden = true;
      $("app-view").hidden = false;
      setStatus("");
      await loadHosts();
      loadHistory();
      startPolling(60_000);
      startNetworkPolling();
    }

    async function loadHosts(selectId) {
      hosts = await api("GET", "/api/hosts");
      const select = $("host-select");
      select.replaceChildren();
      for (const h of hosts) {
        const opt = document.createElement("option");
        opt.value = h.id;
        opt.textContent = `${h.name} (${h.ip})`;  // textContent: no HTML injection
        select.append(opt);
      }
      if (selectId) select.value = selectId;
      const empty = hosts.length === 0;
      for (const id of ["wake-btn", "shutdown-btn", "delete-btn", "host-select"]) $(id).disabled = empty;
      if (empty) {
        setStatus("No hosts yet. Add one below.");
        $("add-details").open = true;
      }
      refreshHostState();  // no await: show the list now, the state fills in after the ping
    }

    function selectedHost() {
      return hosts.find((h) => String(h.id) === $("host-select").value);
    }

    async function refreshHostState() {
      const h = selectedHost();
      const el = $("host-state");
      if (!h) { el.hidden = true; return; }
      el.hidden = false;

      // Show "Checking…" only when the host changed, so the 60s refresh doesn't flicker.
      if (el.dataset.hostId !== String(h.id)) {
        el.dataset.hostId = h.id;
        el.className = "state";
        el.textContent = "Checking…";
      }

      try {
        const { online } = await api("GET", `/api/hosts/${h.id}/status`);
        if (selectedHost()?.id !== h.id) return;  // user switched host while we waited
        el.className = online ? "state online" : "state offline";
        el.textContent = online ? "Online" : "Not responding";
      } catch {
        if (selectedHost()?.id !== h.id) return;
        el.className = "state";
        el.textContent = "Status unknown";
      }
    }

    async function runAction(btn, fn) {
      btn.disabled = true;
      try { await fn(); }
      catch (e) { setStatus(e.message, "error"); }
      finally {
        btn.disabled = hosts.length === 0;
        loadHistory();  // failed attempts are recorded too
      }
    }

    const timeFormat = new Intl.DateTimeFormat(undefined, { dateStyle: "short", timeStyle: "short" });

    async function loadHistory() {
      let events;
      try { events = await api("GET", "/api/events?limit=20"); }
      catch { return; }  // history is secondary; don't overwrite the status message
      $("history").hidden = events.length === 0;
      const rows = events.map((ev) => {
        const tr = document.createElement("tr");
        const cell = (text, cls) => {
          const td = document.createElement("td");
          td.textContent = text;  // textContent: no HTML injection from host names/errors
          if (cls) td.className = cls;
          tr.append(td);
          return td;
        };
        const time = cell(timeFormat.format(new Date(ev.created_at)), "time");
        time.title = new Date(ev.created_at).toLocaleString();
        cell(ev.host_name);
        cell(ev.action === "wake" ? "Wake" : "Shutdown");
        const result = cell(ev.success ? "Sent" : "Failed", ev.success ? "ok" : "failed");
        if (ev.detail) {
          const d = document.createElement("span");
          d.className = "detail";
          d.textContent = ev.detail;
          result.append(d);
        }
        return tr;
      });
      $("history-body").replaceChildren(...rows);
    }

    // ---- Network (archer-monitor) ----

    function startNetworkPolling() {
      clearInterval(networkTimer);
      loadNetwork();
      networkTimer = setInterval(loadNetwork, 10_000);
    }

    // Don't poll in a background tab; refresh right away when it comes back.
    document.addEventListener("visibilitychange", () => {
      if ($("app-view").hidden) return;
      if (document.hidden) { clearInterval(networkTimer); networkTimer = null; }
      else if (!networkTimer) startNetworkPolling();
    });

    const CONNECTIONS = {
      wired: "Wired", "2.4ghz": "2.4 GHz", "5ghz": "5 GHz",
      "guest_2.4ghz": "Guest 2.4 GHz", guest_5ghz: "Guest 5 GHz",
      "iot_2.4ghz": "IoT 2.4 GHz", iot_5ghz: "IoT 5 GHz", offline: "Offline",
    };

    // The router UI shows bits/s, so do the same.
    function formatRate(bytesPerSecond) {
      if (bytesPerSecond == null) return "—";
      const bits = bytesPerSecond * 8;
      if (bits < 1_000) return `${Math.round(bits)} bps`;
      if (bits < 1_000_000) return `${(bits / 1_000).toFixed(1)} kbps`;
      return `${(bits / 1_000_000).toFixed(1)} Mbps`;
    }

    function formatDuration(seconds) {
      const d = Math.floor(seconds / 86400), h = Math.floor(seconds / 3600) % 24, m = Math.floor(seconds / 60) % 60;
      return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
    }

    function ago(unixSeconds) {
      const s = Math.max(0, Math.round(Date.now() / 1000 - unixSeconds));
      return s < 60 ? `${s}s ago` : `${formatDuration(s)} ago`;
    }

    function summaryItem(label, value) {
      const span = document.createElement("span");
      const b = document.createElement("b");
      b.textContent = value;
      span.append(`${label} `, b);
      return span;
    }

    async function loadNetwork() {
      let net;
      try {
        net = await api("GET", "/api/network");
      } catch (e) {
        $("network").hidden = false;
        $("net-warning").hidden = false;
        $("net-warning").textContent = e.message;
        return;  // keep the last table on screen
      }
      if (!net.enabled) {
        $("network").hidden = true;
        clearInterval(networkTimer);
        networkTimer = null;
        return;
      }
      $("network").hidden = false;

      const online = net.devices.filter((d) => d.online).length;
      const summary = [
        summaryItem("Internet", net.wan_up == null ? "unknown" : net.wan_up ? "connected" : "down"),
      ];
      if (net.wan_up && net.wan_uptime_seconds != null) summary.push(summaryItem("for", formatDuration(net.wan_uptime_seconds)));
      if (net.wan_download_bytes_per_second != null) {
        summary.push(summaryItem("↓", formatRate(net.wan_download_bytes_per_second)));
        summary.push(summaryItem("↑", formatRate(net.wan_upload_bytes_per_second)));
      }
      summary.push(summaryItem("Devices", `${online} of ${net.devices.length} online`));
      if (net.last_success) summary.push(summaryItem("Updated", ago(net.last_success)));
      $("net-summary").replaceChildren(...summary);

      const warn = $("net-warning");
      warn.hidden = net.router_reachable;
      warn.textContent = net.last_success
        ? `The exporter can't reach the router right now. Showing data from ${ago(net.last_success)}.`
        : "The exporter hasn't reached the router yet.";

      // Saved hosts by MAC, so devices you control from here are easy to spot.
      const hostByMac = new Map(hosts.map((h) => [h.mac.toUpperCase(), h.name]));

      const rows = net.devices.map((d) => {
        const tr = document.createElement("tr");
        if (!d.online) tr.className = "offline";
        const cell = (text, cls) => {
          const td = document.createElement("td");
          td.textContent = text;  // textContent: device names come from the network
          if (cls) td.className = cls;
          tr.append(td);
          return td;
        };

        const dev = cell(d.name === "unknown" ? "Unknown device" : d.name);
        const host = hostByMac.get(d.mac.toUpperCase());
        if (host) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = host;
          badge.title = "Saved host";
          dev.append(badge);
        }
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = d.ip && d.ip !== "0.0.0.0" ? `${d.ip} · ${d.mac}` : d.mac;
        dev.append(sub);

        const conn = cell(CONNECTIONS[d.connection] ?? d.connection);
        conn.classList.add("dot");
        if (d.online) conn.classList.add("on");

        cell(d.online ? formatRate(d.download_bytes_per_second) : "—", "num");
        cell(d.online ? formatRate(d.upload_bytes_per_second) : "—", "num");
        cell(d.tx_rate_mbps != null ? `${d.tx_rate_mbps} / ${d.rx_rate_mbps ?? "—"} Mbps` : "—", "num");
        cell(d.signal != null ? String(d.signal) : "—", "num");
        return tr;
      });
      $("net-body").replaceChildren(...rows);
    }

    $("login-view").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-status").textContent = "";
      try {
        const me = await api("POST", "/api/auth/login", {
          username: $("username").value, password: $("password").value,
        });
        $("password").value = "";
        await showApp(me.username);
      } catch (err) {
        $("login-status").textContent = err.message;
      }
    });

    $("logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await api("POST", "/api/auth/logout").catch(() => {});
      showLogin();
    });

    $("host-select").addEventListener("change", refreshHostState);

    $("wake-btn").addEventListener("click", (e) => runAction(e.target, async () => {
      const h = selectedHost();
      setStatus(`Waking ${h.name}…`);
      setStatus((await api("POST", `/api/hosts/${h.id}/wake`)).status, "ok");
      pollFastForAWhile();
    }));

    $("shutdown-btn").addEventListener("click", (e) => runAction(e.target, async () => {
      const h = selectedHost();
      if (!confirm(`Shut down ${h.name}?`)) return;
      setStatus(`Shutting down ${h.name}…`);
      setStatus((await api("POST", `/api/hosts/${h.id}/shutdown`)).status, "ok");
      pollFastForAWhile();
    }));

    $("delete-btn").addEventListener("click", (e) => runAction(e.target, async () => {
      const h = selectedHost();
      if (!confirm(`Remove ${h.name} from your hosts?`)) return;
      await api("DELETE", `/api/hosts/${h.id}`);
      await loadHosts();
      if (hosts.length) setStatus(`Removed ${h.name}`, "ok");
    }));

    $("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const host = await api("POST", "/api/hosts", {
          name: $("h-name").value, mac: $("h-mac").value, ip: $("h-ip").value,
          ssh_username: $("h-user").value, os_type: $("h-os").value,
        });
        e.target.reset();
        $("add-details").open = false;
        await loadHosts(host.id);
        setStatus(`Added ${host.name}`, "ok");
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    // On load: already logged in (cookie) → app, otherwise → login form.
    fetch("/api/auth/me")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((me) => showApp(me.username))
      .catch(showLogin);
  </script>
</body>
</html>
