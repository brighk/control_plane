[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.2",
    "itsdangerous>=2.2.0",
    "paramiko>=5.1.0",
    "pwdlib[argon2]>=0.4.2",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "prek>=0.5.11",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
    "types-paramiko>=5.1.0.20261030",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["."]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
